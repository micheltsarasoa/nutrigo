name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: Detect app code
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
      has_docker: ${{ steps.check.outputs.has_docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Markdown-only changes (docs, CLAUDE.md, skills) skip e2e; a skipped job still passes a required check.
          # If the diff can't be computed (a new branch's first push), run everything.
          files=$(git diff --name-only "$BASE" HEAD) || files=unknown
          if [ -z "$files" ] || echo "$files" | grep -qv '\.md$'; then echo "has_code=true" >> "$GITHUB_OUTPUT"; else echo "has_code=false" >> "$GITHUB_OUTPUT"; echo "Markdown only - e2e skipped."; fi
          if [ -f Dockerfile ]; then echo "has_docker=true" >> "$GITHUB_OUTPUT"; else echo "has_docker=false" >> "$GITHUB_OUTPUT"; echo "No Dockerfile yet (#18) - docker job skipped."; fi

  quality:
    name: Lint, typecheck, unit/integration/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          if-no-files-found: ignore

  e2e:
    name: E2E + visual (Playwright)
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          # The snapshot folders carry any baseline CI just wrote (a newly approved component).
          path: |
            apps/web/playwright-report/
            apps/web/e2e/*-snapshots/

  docker:
    name: Docker image builds
    needs: detect
    # Deactivated for now. To turn it back on, restore:
    # if: needs.detect.outputs.has_docker == 'true'
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up --build (SPEC-001 AC-2)
        run: docker compose up --build --detach --wait --wait-timeout 60
      - name: /api/health is ok and / serves the web shell
        run: |
          curl -fsS localhost:3000/api/health | tee /dev/stderr | grep -q '"db":"ok"'
          curl -fsS localhost:3000/ | grep -q '<title>NutriGo</title>'
          curl -fsS localhost:3000/recipes | grep -q '<title>NutriGo</title>'
      - name: The image serves the PWA files (ADR-0012)
        run: |
          curl -fsSI localhost:3000/sw.js | grep -qi '^content-type: text/javascript'
          curl -fsSI localhost:3000/manifest.webmanifest | grep -qi '^content-type: application/manifest+json'
      - name: Container logs
        if: always()
        run: docker compose logs
      - run: docker compose down
        if: always()
