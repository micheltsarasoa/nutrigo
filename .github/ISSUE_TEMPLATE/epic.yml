    id: prd
    attributes: { label: PRD references, placeholder: "P-1, P-2" }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal and outcome }
    validations: { required: true }
  - type: input
    id: spec
    attributes: { label: Spec, placeholder: docs/specs/SPEC-00X-… }
