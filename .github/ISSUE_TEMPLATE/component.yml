name: Component
description: An atom, molecule or organism. The sketch is validated first, then test → component → playground
title: "component: "
labels: ["type:component"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Atomic level
      options: [atom, molecule, organism]
    validations: { required: true }
  - type: input
    id: design
    attributes: { label: Design reference, placeholder: "Claude Design page / design/source/…" }
    validations: { required: true }
  - type: textarea
    id: composition
    attributes: { label: Built from (lower-level components, all already approved) }
  - type: textarea
    id: states
    attributes:
      label: States to show in the playground
      value: "- default\n- focus\n- disabled\n- loading\n- empty\n- error\n- long content\n- 320px / 1280px"
    validations: { required: true }
  - type: checkboxes
    id: flow
    attributes:
      label: Workflow
      options:
        - label: 1. Failing test committed
        - label: 2. Component implemented (tokens only)
        - label: 3. Playground demo with every state
        - label: 4. Sketch validated by the owner in Claude Design (before step 1)
        - label: 5. Screenshot baseline committed
